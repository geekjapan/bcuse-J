[project]
name = "bcuse"
version = "0.1.0"
description = "One agent for browser and desktop, driven by an LLM or a Decision model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "browser-use @ git+https://github.com/geekjapan/browser-use@76e5847814d6ba5b83e5b9948ffb6648c2d76feb",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
